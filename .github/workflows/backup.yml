name: Sauvegarde de la base

# Export hebdomadaire des données de l'application, chiffré avant d'être conservé :
# le dépôt est public, donc rien de lisible ne doit sortir de ce job.
# Secrets à créer (Settings > Secrets and variables > Actions) :
#   BACKUP_DATABASE_URL : chaîne de connexion « Session pooler » de Supabase
#   BACKUP_PASSPHRASE   : mot de passe de chiffrement (à conserver ailleurs : sans lui, la sauvegarde est inutilisable)

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Vérifier la configuration
        id: config
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Secrets BACKUP_DATABASE_URL / BACKUP_PASSPHRASE absents : sauvegarde ignorée."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer le client PostgreSQL 17
        if: steps.config.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Exporter et chiffrer
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # Les sessions et jetons OAuth ne sont pas sauvegardés : inutiles, et sensibles.
          /usr/lib/postgresql/17/bin/pg_dump "$BACKUP_DATABASE_URL" \
            --schema=public --no-owner --no-privileges --format=custom \
            --exclude-table-data='"Session"' \
            --exclude-table-data='"Account"' \
            --exclude-table-data='"VerificationToken"' \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                --passphrase "$BACKUP_PASSPHRASE" \
                -o "sauvegarde-$(date +%F).dump.gpg"
          ls -l sauvegarde-*.dump.gpg

      - name: Conserver 90 jours
        if: steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-chiffree
          path: sauvegarde-*.dump.gpg
          retention-days: 90
          if-no-files-found: error
